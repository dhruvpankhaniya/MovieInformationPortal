<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Information Portal - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="main-header">
        <div class="logo">
            <h1>🎬 Movie Portal</h1>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h2>Contact / Feedback</h2>

        <section id="contact-form-section">

            <form id="contact-form" novalidate>

                <div class="form-group">
                    <label for="contact-name">Name:</label>
                    <input type="text" id="contact-name" name="contact-name" required>
                    <span class="error-msg" id="contact-name-error"></span>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email:</label>
                    <input type="email" id="contact-email" name="contact-email" required>
                    <span class="error-msg" id="contact-email-error"></span>
                </div>

                <div class="form-group">
                    <label for="contact-subject">Subject:</label>
                    <input type="text" id="contact-subject" name="contact-subject" required>
                    <span class="error-msg" id="contact-subject-error"></span>
                </div>

                <div class="form-group">
                    <label for="contact-message">Message:</label>
                    <textarea id="contact-message" name="contact-message" rows="5" required></textarea>
                    <span class="error-msg" id="contact-message-error"></span>
                </div>

                <button type="submit" id="submit-contact-btn">Send Message</button>
                <p id="contact-success-msg" style="display:none;">Your message has been sent successfully!</p>
            </form>

        </section>

    </main>

    <footer id="main-footer">
        <p>&copy; 2026 Movie Information Portal | Web Technology - I (2301CS363)</p>
        <p>Darshan Institute of Engineering and Technology</p>
    </footer>

    <!-- <script src="js/validation.js"></script> -->

</body>
</html>
